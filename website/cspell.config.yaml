# Spelling for the site's prose, checked before a release (tools/qa/README.md):
#
#   npx cspell@10.3.5 lint --no-progress
#
# British English, as the site is written. The words below are the ones the dictionaries
# lack: R and FreeSurfer names, people, journals and system libraries. Behavior, honor and
# judgment are the Contributor Covenant's, quoted verbatim on /help; analyzed is NEWS.md's,
# which is the package's and in American English.
version: '0.2'
language: en-GB
files:
  - src/content/**/*.md
  - src/pages/**/*.astro
  - src/components/**/*.astro
  - src/layouts/**/*.astro
  - src/data/*.ts
  - src/data/reference.json
  - src/data/glossary.md
  - ../NEWS.md
